spring.application.name=bookstore

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/bookstore}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoint.health.show-components=always

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

server.port=8080

app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

spring.data.web.pageable.max-page-size=100

app.order.delivery-fee=400.00

app.payhere.merchant-id=${PAYHERE_MERCHANT_ID}
app.payhere.merchant-secret=${PAYHERE_MERCHANT_SECRET}
app.payhere.checkout-url=https://sandbox.payhere.lk/pay/checkout
app.payhere.notify-url=${PAYHERE_NOTIFY_URL:http://localhost:8080/api/v1/payments/payhere/notify}
app.payhere.return-url=${PAYHERE_RETURN_URL:http://localhost:5173/payment/return}
app.payhere.cancel-url=${PAYHERE_CANCEL_URL:http://localhost:5173/payment/cancel}