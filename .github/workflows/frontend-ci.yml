
name: Bookstore Frontend CI

on:
  push:
    paths:
      - "frontend-js/**"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    paths:
      - "frontend-js/**"
      - ".github/workflows/frontend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    name: Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-js

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-js/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Quality
        run: npm run lint

      - name: Build Frontend
        run: npm run build
